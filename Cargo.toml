[package]
name         = "dix"
version      = "3.0.0"
edition      = "2024"
rust-version = "1.97.0"
description  = "Diff Nix"
readme       = "README.md"
homepage     = "https://github.com/faukah/dix"
repository   = "https://github.com/faukah/dix"
license      = "GPL-3.0-only"
keywords     = [ "nix", "nixos" ]
categories   = [ "command-line-utilities" ]
include      = [ "CHANGELOG.md", "Cargo.lock", "Cargo.toml", "LICENSE.md", "README.md", "src/**" ]

[dependencies]
diff               = "0.1.13"
itertools          = "0.15.0"
misstep            = { features = [ "color", "pretty" ], version = "0.4.1" }
pound              = "0.5.1"
rusqlite           = { default-features = false, features = [ "cache" ], version = "0.40.0" }
serde              = { features = [ "derive" ], version = "1.0.228" }
serde_json         = "1.0.149"
size               = "0.6.0"
tracing            = { default-features = false, features = [ "std" ], version = "0.1" }
tracing-subscriber = { features = [ "env-filter" ], version = "0.3" }
unicode-width      = "0.2.0"
yansi              = { features = [ "detect-env", "detect-tty" ], version = "1.0.1" }

[dev-dependencies]
proptest = "1.6.0"
tempfile = "3.10.0"

# See:
#  <https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html>
[lints.clippy]
# The lint groups above enable some less-than-desirable rules, we should manually
# enable those to keep our sanity.
absolute_paths                       = "allow"
arbitrary_source_item_ordering       = "allow"
cargo                                = { level = "warn", priority = -1 }
clone_on_ref_ptr                     = "warn"
complexity                           = { level = "warn", priority = -1 }
dbg_macro                            = "warn"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
exit                                 = "warn"
expect_used                          = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
implicit_return                      = "allow"
infinite_loop                        = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_docs_in_private_items        = "allow"
non_ascii_literal                    = "allow"
non_std_lazy_statics                 = "warn"
nursery                              = { level = "warn", priority = -1 }
pathbuf_init_then_push               = "warn"
pattern_type_mismatch                = "allow"
pedantic                             = { level = "warn", priority = -1 }
perf                                 = { level = "warn", priority = -1 }
print_stderr                         = "warn"
print_stdout                         = "warn"
question_mark_used                   = "allow"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
rest_pat_in_fully_bound_structs      = "warn"
similar_names                        = "allow"
single_call_fn                       = "allow"
std_instead_of_core                  = "allow"
style                                = { level = "warn", priority = -1 }
todo                                 = "warn"
too_long_first_doc_paragraph         = "allow"
too_many_lines                       = "allow"
undocumented_unsafe_blocks           = "warn"
unimplemented                        = "warn"
unnecessary_safety_comment           = "warn"
unreachable                          = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "allow"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
